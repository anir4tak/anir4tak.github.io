<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topz</title>
  <meta name="description" content="Topz (Mark Christofher Rodriguez), a developer in Iloilo City, Philippines. Step into the room and click around.">
  <meta property="og:title" content="Topz's room">
  <meta property="og:description" content="A pixel-art portfolio. Click around the room.">
  <meta name="theme-color" content="#0d0f1c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="sr-only">Topz — Mark Christofher Rodriguez</h1>

  <main>
    <div id="viewport" class="viewport">
    <div id="stage" class="stage">
      <canvas id="room" role="img" aria-label="A pixel-art room: Topz codes at his desk under a glowing white TOPZ neon sign while his dog Mochi naps nearby. Use the buttons below to open About, Projects, Contact and Music."></canvas>
      <div id="tip" class="tip" hidden></div>
      <div id="bubble" class="bubble" hidden></div>
      <div id="talk" class="talk" hidden role="status">
        <canvas id="talk-face" class="talk-face" width="32" height="32" aria-hidden="true"></canvas>
        <div class="talk-box">
          <span id="talk-name" class="talk-name"></span>
          <p id="talk-text" class="talk-text"></p>
          <span class="talk-more" aria-hidden="true">▼ click to close</span>
        </div>
      </div>
    </div>
    </div>
    <p id="pan-hint" class="pan-hint" hidden>← swipe to look around →</p>

    <div class="hud">
      <nav class="hotbar" aria-label="Sections">
        <button class="slot" data-open="about"><svg viewBox="0 0 8 8" aria-hidden="true"><rect x="2" y="0" width="4" height="4" fill="#c98a5e"/><rect x="2" y="0" width="4" height="1" fill="#15121c"/><rect x="1" y="5" width="6" height="3" fill="#2bbecb"/></svg><span>About</span><kbd>1</kbd></button>
        <button class="slot" data-open="projects"><svg viewBox="0 0 8 8" aria-hidden="true"><rect x="0" y="0" width="8" height="8" fill="#5e3b28"/><rect x="1" y="1" width="6" height="6" fill="#f4f6fb"/><rect x="1" y="1" width="6" height="2" fill="#4fb3c9"/><rect x="2" y="4" width="3" height="1" fill="#2b3245"/></svg><span>Projects</span><kbd>2</kbd></button>
        <button class="slot" data-open="contact"><svg viewBox="0 0 8 8" aria-hidden="true"><rect x="0" y="1" width="8" height="2" fill="#17707a"/><rect x="1" y="3" width="6" height="5" fill="#2bbecb"/><rect x="3" y="4" width="2" height="2" fill="#e9edf5"/></svg><span>Contact</span><kbd>3</kbd></button>
        <button class="slot" data-open="jukebox"><svg viewBox="0 0 8 8" aria-hidden="true"><rect x="1" y="0" width="6" height="8" fill="#8a5a3c"/><rect x="2" y="1" width="4" height="3" fill="#14101c"/><rect x="3" y="2" width="2" height="1" fill="#2bbecb"/><rect x="2" y="5" width="1" height="2" fill="#ff6f91"/><rect x="4" y="5" width="1" height="2" fill="#f6d365"/></svg><span>Music</span><kbd>4</kbd></button>
      </nav>
      <p id="status" class="status" aria-live="off"></p>
    </div>
  </main>

  <div id="rotate" class="rotate" hidden role="dialog" aria-modal="true" aria-labelledby="rotate-title">
    <div class="rotate-phone" aria-hidden="true"><span></span></div>
    <h2 id="rotate-title">Turn your phone sideways</h2>
    <p>Topz's room is built for landscape.</p>
    <button id="rotate-skip" class="slot">Show me anyway</button>
  </div>

  <dialog id="panel" class="panel" aria-labelledby="panel-title">
    <div class="panel-bar">
      <h2 id="panel-title"></h2>
      <button id="panel-close" class="close" aria-label="Close">✕</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
    <div id="jukebox" class="panel-body jukebox" hidden>
      <div id="now-playing" class="now" aria-live="polite"></div>
      <div class="tabs" role="tablist" aria-label="Playlists"></div>
      <div class="player"><div id="spotify-embed"></div></div>
      <p class="muted">Want more? <a id="spotify-profile" target="_blank" rel="noopener noreferrer">Follow me on Spotify ↗</a></p>
    </div>
  </dialog>

  <noscript><p class="noscript">This room needs JavaScript. Reach Topz at <a href="mailto:devmarkchristofher@gmail.com">devmarkchristofher@gmail.com</a>.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
